# Builds the Mac and Windows installers.
# - Push a tag like v1.0.0 to publish them to a GitHub Release (people download from there).
# - Or run it from the Actions tab to just build and download the results from the run.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            file: Runon-mac.dmg
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis
            bundle: src-tauri/target/release/bundle/nsis/*.exe
            file: Runon-windows-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Add both Mac chip targets
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      # Fixed names so download links can always point at the latest release.
      - name: Name the installer
        shell: bash
        run: mkdir -p dist && cp ${{ matrix.bundle }} dist/${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: runon-${{ matrix.name }}
          path: dist/${{ matrix.file }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
