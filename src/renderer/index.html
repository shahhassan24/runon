<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Runon</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' runon-media:; media-src runon-media:">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="main">
    <div class="drag-strip"></div>
    <textarea id="editor" spellcheck="false" aria-label="Your entry"></textarea>
    <video id="player" controls hidden></video>

    <nav id="nav">
      <div class="nav-group" id="fontNav">
        <button id="sizeBtn" type="button">18px</button>
        <span class="dot">•</span>
        <button class="font-btn" type="button" data-font="Lato">Lato</button>
        <span class="dot">•</span>
        <button class="font-btn" type="button" data-font="Arial">Arial</button>
        <span class="dot">•</span>
        <button class="font-btn" type="button" data-font="System">System</button>
        <span class="dot">•</span>
        <button class="font-btn" type="button" data-font="Serif">Serif</button>
        <span class="dot">•</span>
        <button id="randomBtn" type="button">Random</button>
      </div>
      <div class="nav-spacer"></div>
      <div class="nav-group">
        <button id="timerBtn" type="button">15:00</button>
        <span class="dot">•</span>
        <div class="anchor">
          <button id="videoBtn" type="button" aria-label="Record a video entry">
            <svg viewBox="0 0 16 16" class="icon"><rect x="1" y="3.5" width="9.5" height="9" rx="2"/><path d="M11.5 7 15 4.8v6.4L11.5 9z"/></svg>
            <span class="spinner" hidden></span>
          </button>
          <div class="popover" id="videoPopover" hidden></div>
        </div>
        <span class="dot">•</span>
        <div class="anchor">
          <button id="chatBtn" type="button">Chat</button>
          <div class="popover" id="chatPopover" hidden></div>
        </div>
        <span class="dot">•</span>
        <button id="backspaceBtn" type="button">Backspace is On</button>
        <span class="dot" id="backspaceDot">•</span>
        <button id="fullscreenBtn" type="button">Fullscreen</button>
        <span class="dot">•</span>
        <button id="newEntryBtn" type="button">New Entry</button>
        <span class="dot">•</span>
        <button id="themeBtn" type="button" aria-label="Switch theme">
          <svg viewBox="0 0 16 16" class="icon" id="moonIcon"><path d="M13.6 10.4A6.2 6.2 0 0 1 5.6 2.4a6.2 6.2 0 1 0 8 8z"/></svg>
          <svg viewBox="0 0 16 16" class="icon" id="sunIcon" hidden><circle cx="8" cy="8" r="3.2"/><path class="stroke" d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M13 3l-1.4 1.4M4.4 11.6 3 13"/></svg>
        </button>
        <span class="dot">•</span>
        <button id="historyBtn" type="button" aria-label="Show history">
          <svg viewBox="0 0 16 16" class="icon"><path class="stroke" d="M2.5 8a5.5 5.5 0 1 0 1.7-4M2.3 2.2v2.6h2.6M8 5v3.3l2.2 1.3"/></svg>
        </button>
      </div>
    </nav>
  </main>

  <aside id="sidebar" hidden>
    <button id="historyHeader" type="button">
      <span class="history-title">History <span aria-hidden="true">↗</span></span>
      <span class="history-path" id="historyPath"></span>
    </button>
    <div id="entryList"></div>
    <div id="credit">
      <img class="logo logo-dark-ink" src="assets/runon-logo-dark-ink.svg" alt="Runon">
      <img class="logo logo-light-ink" src="assets/runon-logo-light-ink.svg" alt="Runon">
      <span>Built by Lord Shady</span>
    </div>
  </aside>

  <section id="recorder" hidden>
    <video id="preview" autoplay muted playsinline></video>
    <div id="recorderNav">
      <button id="recorderClose" type="button">Close</button>
      <div id="recorderStatus" hidden>
        <span class="rec-dot"></span><span>Recording</span><span class="dot">•</span><span id="recorderTime">0:00</span>
      </div>
      <div class="nav-spacer"></div>
      <button id="recorderToggle" type="button">Start Recording</button>
    </div>
  </section>
</div>
<script src="prompts.js"></script>
<script src="app.js"></script>
</body>
</html>
